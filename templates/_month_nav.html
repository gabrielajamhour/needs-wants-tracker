{% macro month_nav(links, picker_action=None) %}

<nav class="month-nav" aria-label="Month navigation">

    <a class="button ghost icon-button" href="{{ links.prev_url }}" aria-label="Previous month">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    {% if picker_action %}
        {# The month title opens the native picker; without JavaScript the field and the Go button show instead #}
        <form method="get" action="{{ picker_action }}" class="month-picker">
            <button type="button" class="month-title month-title-button" aria-label="Choose month, {{ links.month | month_label }}" hidden>
                {{ links.month | month_label }}
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <input class="month-input" name="month" type="month" value="{{ links.month }}" aria-label="Choose month">
            <noscript><button type="submit" class="ghost small">Go</button></noscript>
        </form>
    {% else %}
        <strong class="month-title">{{ links.month | month_label }}</strong>
    {% endif %}

    <a class="button ghost icon-button" href="{{ links.next_url }}" aria-label="Next month">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

</nav>

{% endmacro %}
