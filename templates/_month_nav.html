{% macro month_nav(links, picker_action=None) %}

<nav class="month-nav" aria-label="Month navigation">
    
    <a class="month-arrow" href="{{ links.prev_url }}" aria-label="Previous month">‹</a>
    <strong>{{ links.month | month_label }}</strong>
    <a class="month-arrow" href="{{ links.next_url }}" aria-label="Next month">›</a>

    {% if picker_action %}
    <form method="get" action="{{ picker_action }}" class="month-picker">
        <button type="button" class="month-arrow month-calendar" aria-label="Choose month" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <input class="month-input" name="month" type="month" value="{{ links.month }}" aria-label="Choose month">
        <noscript><button type="submit" class="secondary small">Go</button></noscript>
    </form>
    {% endif %}

</nav>

{% endmacro %}
