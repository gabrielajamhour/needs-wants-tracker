{% extends "layout.html" %}

{% block title %}
    {{ heading }}
{% endblock %}

{% block content %}

<div class="expense-page">

    <a class="back-link" href="{{ back_url }}">← Back to expenses</a>

    <h1>{{ heading }}</h1>

    <form method="post" class="expense-form">

        <div class="field amount-field">
            <label for="amount">Amount</label>
            <div class="amount-input">
                <input
                    id="amount"
                    name="amount"
                    type="text"
                    inputmode="decimal"
                    value="{{ form.get('amount', '') }}"
                    placeholder="0,00"
                    autocomplete="off"
                    autofocus
                    required
                > <!-- Maintain the value when the form needs to be displayed again following an error -->
                <span class="amount-currency" aria-hidden="true">€</span>
            </div>
            <span class="hint">Use a comma for cents, e.g. 12,50</span>
        </div>

        <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" maxlength="100" value="{{ form.get('name', '') }}" required>
            <div id="suggestion" class="suggestion" hidden aria-live="polite">
                <span>Suggested category:</span>
                <strong id="suggestion-label"></strong>
                <button type="button" id="suggestion-use" class="button ghost small"></button>
            </div>
        </div>

        <div class="field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" value="{{ form.get('date', '') }}" required>
        </div>

        <div class="field">
            <label for="category_id">Category</label>
            <select id="category_id" name="category_id" required>

                <a id="manage-categories-link" class="hint-link" href="{{ url_for('manage_categories') }}">
                    Can't find the category? Manage categories
                </a>

                <option value="">Choose...</option>

                {% for type in ["needs", "wants", "savings"] %}

                <optgroup label="{{ type | capitalize }}">

                    {% for c in categories %}

                    {% if c["type"] == type %}

                    {# The expenses table does not store the category name, but rather the category_id #}
                    <option value="{{ c['id'] }}" {% if form.get('category_id') | int==c['id'] %} selected {% endif %}>
                        {# Maintain the selected category when the form needs to be displayed again following an error
                        #}
                        {{ c["emoji"] | capitalize }}
                        {{ c["name"] | capitalize }}
                    </option>

                    {% endif %}

                    {% endfor %}

                </optgroup>

                {% endfor %}

            </select>
        </div>

        <div class="form-actions">
            <button type="submit">Save</button>
            <a class="button ghost" href="{{ back_url }}">Cancel</a>
        </div>

    </form>

</div>

<script>

    // Used a function to keep the script's variables within the function's scope,
    // in order to avoid name conflicts with other potential scripts
    (function () {

        const nameInput = document.getElementById("name");
        const select = document.getElementById("category_id");
        const box = document.getElementById("suggestion");
        const label = document.getElementById("suggestion-label");
        const useButton = document.getElementById("suggestion-use");

        let timer = null;
        let current = null; // Stores the category suggestion currently being displayed

        function capitalize(text) {
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        // Hide the suggestion and clear the stored suggestion
        function hide() {
            box.hidden = true;
            current = null;
        }

        async function fetchSuggestion() {

            const name = nameInput.value.trim();

            if (!name) { hide(); return; }

            try {
                const url = "{{ url_for('suggest_category') }}?name=" + encodeURIComponent(name);
                const response = await fetch(url); // HTTP response

                if (!response.ok) { hide(); return; }

                const data = await response.json();

                // Ignore the answer if the user kept typing in the meantime
                if (nameInput.value.trim() !== name) { return; }

                // There is no need to display a button for selecting a category that is already selected
                if (!data.suggestion || String(data.suggestion.id) === select.value) {
                    hide();
                    return;
                }

                current = data.suggestion;

                label.textContent = current.emoji + " " + capitalize(current.name) + " · " + capitalize(current.type);
                useButton.textContent = "Use";

                box.hidden = false;
            } catch (error) {
                hide();
            }
        }

        // Listener to detect when the user types
        nameInput.addEventListener("input", function () {
            clearTimeout(timer);
            timer = setTimeout(fetchSuggestion, 300);  // debounce: wait for a pause in typing
        });

        // Listener button to execute the function
        useButton.addEventListener("click", function () {
            if (current) {
                select.value = String(current.id);
                hide();
            }
        });

        // Listener to hide the suggestion when the category changes
        select.addEventListener("change", hide);
    })();

</script>

{% endblock %}
