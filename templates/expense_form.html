{% extends "layout.html" %}

{% block title %}
    New expense
{% endblock %}

{% block content %}

<h1>Nova despesa</h1>

<form method="post">

    <div class="field">
        <label for="name">Name</label>
        <input 
            id="name" 
            name="name" 
            type="text" 
            value="{{ form.get('name', '') }}" 
            required
        >
    </div>

    <div class="field">
        <label for="amount">Amount (€)</label>
        <input 
            id="amount" 
            name="amount" 
            type="text" 
            inputmode="decimal"
            value="{{ form.get('amount', '') }}" 
            placeholder="0,00" 
            required
        > <!-- Maintain the value when the form needs to be displayed again following an error -->
        <span class="hint">Use a comma for the cents (e.g., 12,50).</span>
    </div>

    <div class="field">
        <label for="date">Date</label>
        <input 
            id="date" 
            name="date" 
            type="date" 
            value="{{ form.get('date', '') }}" 
            required
        >
    </div>

    <div class="field">
        <label for="category_id">Category</label>
        <select id="category_id" name="category_id" required>

            <option value="">Choose...</option>

            {% for type, items in categories | groupby("type") %}

            <optgroup label="{{ type | capitalize }}">

                {% for c in items %}

                    {# The expenses table does not store the category name, but rather the category_id #}
                    <option value="{{ c['id'] }}" 
                        {% if form.get('category_id') | int == c['id'] %}
                            selected
                        {% endif %}
                    >
                        {# Maintain the selected category when the form needs to be displayed again following an error #}
                        {{ c["name"] }}
                    </option>

                {% endfor %}

            </optgroup>

            {% endfor %}

        </select>
    </div>

    <button type="submit">Save</button>

</form>

{% endblock %}
