<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> <!-- Flask automatically generates the path to the file -->
    <title>
        {% block title %}
            Needs/Wants Tracker
        {% endblock %}
    </title>
</head>

<body>
    <header>
        <strong>Needs/Wants Tracker</strong>
        <nav>
            <a href="{{ url_for('index') }}">Expenses</a>
            <a href="{{ url_for('new_expense') }}">New expense</a>
            <a href="{{ url_for('summary') }}">Summary</a>
            <a href="{{ url_for('manage_categories') }}">Categories</a>
        </nav>
    </header>
    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
        {# get_flashed_messages returns a list of (category, message) tuples #}

            <p class="flash {{ category }}" role="status">
                {{ message }}
            </p>

        {% endfor %}

        {% block content %}

        {% endblock %}
    </main>
</body>

</html>
